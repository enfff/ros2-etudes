teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4              # L1  ← hold this to enable movement
    enable_turbo_button: 5        # R1  ← hold for higher speed

    axis_linear:
      x: 1                        # Left stick vertical (up/down)
    scale_linear:
      x: 0.4                      # Normal max speed (m/s)
    scale_linear_turbo:
      x: 0.9

    axis_angular:
      yaw: 0                      # Left stick horizontal (left/right)
    scale_angular:
      yaw: 0.8
    scale_angular_turbo:
      yaw: 1.3